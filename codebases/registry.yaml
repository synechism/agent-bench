# Codebase registry — pinned repos and commits for reproducible benchmarks.
# Each entry maps a short name to a repo URL + pinned commit.
#
# Selection principle:
# - Vary ecosystems (Python, Rust, TypeScript, C) to separate agent runtime
#   overhead from target build/test cost.
# - Projects with substantial test suites for the "tests" modality.
# - Projects with well-documented GitHub issues for the "qa" modality.

redis:
  repo_url: https://github.com/redis/redis
  commit: "7.2.5"  # stable release tag
  language: c

redis_getex_expire_event_base:
  repo_url: https://github.com/redis/redis
  commit: "da8f7428fae4ccffa5e07d869f65fe7413898f78"  # parent of 0dfb0250
  language: c

redis_expire_options_base:
  repo_url: https://github.com/redis/redis
  commit: "82c3158ad5fe5aab002a6d0565832d5bd15082f5"  # parent of f74af0e6
  language: c

fastapi:
  repo_url: https://github.com/tiangolo/fastapi
  commit: "0.115.6"
  language: python

ripgrep:
  repo_url: https://github.com/BurntSushi/ripgrep
  commit: "14.1.1"
  language: rust

shadcn-ui:
  repo_url: https://github.com/shadcn-ui/ui
  commit: "0.8.0"
  language: typescript

linux_v6_6:
  repo_url: https://github.com/torvalds/linux
  commit: "v6.6"
  language: c

empty_baseline:
  repo_url: builtin:empty
  commit: "builtin-empty-v1"
  language: text

# Future additions (week 3+):
# Full-kernel build/test tasks should be opt-in: they need substantial disk,
# time, and memory. Prefer focused selftests or compile-only checks by default.
