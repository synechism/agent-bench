[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-harness-bench"
version = "0.1.0"
description = "Agent-agnostic resource benchmarking platform for coding agents"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
harness = "orchestrator.run:main"
harness-matrix = "orchestrator.matrix:main"

[tool.setuptools.packages.find]
include = ["orchestrator*", "adapters*", "measure*", "analysis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
